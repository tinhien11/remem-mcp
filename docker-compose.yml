services:
  remem-mcp:
    build: .
    container_name: remem-mcp
    volumes:
      - remem-data:/data
    environment:
      - REMEM_DB_PATH=/data/memory.db
      - REMEM_AUDIT_LOG_PATH=/data/audit.jsonl
      # Uncomment to enable LLM pipeline features
      # - REMEM_LLM_API_KEY=sk-...
      # - REMEM_LLM_BASE_URL=https://api.openai.com/v1
      # - REMEM_LLM_MODEL=gpt-4o-mini
      # - REMEM_PIPELINE=atom
    # For MCP stdio: stdin_open + tty
    stdin_open: true
    tty: true

  # Optional: web viewer
  remem-mcp-viewer:
    build: .
    container_name: remem-mcp-viewer
    command: ["viewer"]
    ports:
      - "7331:7331"
    volumes:
      - remem-data:/data
    depends_on:
      - remem-mcp

volumes:
  remem-data:
