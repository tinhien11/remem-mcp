name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Publish to npm via Trusted Publishing (OIDC — no token needed)
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm latest (for OIDC support)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          REMEM_DB_PATH: /tmp/remem-test/memory.db

      - name: Publish to npm (Trusted Publishing / OIDC)
        run: npm publish --provenance --access public

  # Publish Docker image to ghcr.io
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/remem-mcp:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/remem-mcp:latest

  # Create GitHub Release
  release:
    runs-on: ubuntu-latest
    needs: [npm, docker]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## npm
            ```
            npx remem-mcp@${{ steps.version.outputs.VERSION }}
            ```

            ## Docker
            ```
            docker pull ghcr.io/tinhien11/remem-mcp:${{ steps.version.outputs.VERSION }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
